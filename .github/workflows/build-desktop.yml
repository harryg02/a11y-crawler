name: Build desktop app

# Builds the Electron app on each OS's own runner. Native runners are required
# because better-sqlite3 is a native addon and can't be reliably cross-compiled;
# each runner rebuilds it for Electron's ABI (electron-builder npmRebuild).
#
# Run manually via the Actions tab (workflow_dispatch), or push a tag like
# v1.0.0 to also publish the artifacts to a GitHub Release.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to create the Release on tag pushes

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 20 ships a node-gyp that builds better-sqlite3 cleanly. (Newer
          # Node caused a gyp/CLI incompatibility during local testing.)
          node-version: 20
          cache: npm

      # `npm ci` runs install scripts here (unlike the dev sandbox), so Electron
      # downloads and better-sqlite3 compiles automatically.
      - run: npm ci

      # next build (standalone) + prepare standalone dir + bundle crawler, then
      # electron-builder for the host platform's targets (installers + green zips).
      - name: Build distributables
        run: npm run dist -- --publish never
        env:
          # Don't attempt macOS code signing on CI (no cert); ship unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: a11y-crawler-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.deb
            dist/*.exe
            dist/*.dmg
            dist/*.zip

      - name: Publish to Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.exe
            dist/*.dmg
            dist/*.zip
