name: Build desktop app

# Builds the Electron app on each OS's own runner. Native runners are required
# because better-sqlite3 is a native addon and can't be reliably cross-compiled.
# The rebuild for Electron's ABI is done by scripts/prepare-sqlite-native.mjs,
# NOT by electron-builder — build.npmRebuild is false on purpose, because the
# asar carries no node_modules at all (build.files is electron/ + package.json).
# The copy that matters ships as an extraResource inside .next/standalone.
#
# Run manually via the Actions tab (workflow_dispatch), or push a tag like
# v1.0.0 to also publish the artifacts to a GitHub Release.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to create the Release on tag pushes

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # windows-2022 (not windows-latest) so Visual Studio 2022 is present:
        # node-gyp 9 — used to compile better-sqlite3 — doesn't recognise the
        # newer VS on windows-latest.
        os: [ubuntu-latest, windows-2022, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # better-sqlite3's source build uses node-gyp 9, whose gyp imports
      # distutils (removed in Python 3.12+). Runners ship Python 3.12–3.14, so
      # pin 3.11, which still has distutils, and point node-gyp at it via PYTHON.
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.11"

      # `npm ci` runs install scripts here (unlike the dev sandbox), so Electron
      # downloads and better-sqlite3 compiles automatically.
      - name: Install dependencies
        run: npm ci
        env:
          PYTHON: ${{ steps.py.outputs.python-path }}

      # next build (standalone) + prepare standalone dir + bundle crawler, then
      # electron-builder for the host platform's targets (installers + green zips).
      # patch-standalone-sqlite.mjs shells out to node-gyp inside this step, so it
      # needs the same PYTHON.
      - name: Build distributables
        run: npm run dist -- --publish never
        env:
          PYTHON: ${{ steps.py.outputs.python-path }}
          # Don't attempt macOS code signing on CI (no cert); ship unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: a11y-crawler-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.exe
            dist/*.dmg
            dist/*.zip

      - name: Publish to Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.exe
            dist/*.dmg
            dist/*.zip
